[project]
name = "uzair-transport-backend"
version = "0.1.0"
description = "Backend API for Uzair Transport Service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "httpx>=0.27,<1.0",
  "PyJWT>=2.10,<3.0",
  "pydantic<2",
]

[project.optional-dependencies]
postgres = [
  "asyncpg>=0.30,<1.0",
]
dev = [
  "flake8>=7.1,<8.0",
  "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
